name: Unit Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  unit-test:
    uses: sxzz/workflows/.github/workflows/unit-test.yml@main
    with:
      skip-test: false
      # Build runs publint + attw before lint
      build-for-lint: true
      lint: pnpm run lint
